<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page not Found</title>

    <link rel="icon" href="/mars-globe.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        background: #131313;
        color: #eceae6;
        font-family: "Inter", sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
      }

      .content {
        width: 100%;
        max-width: 32rem;
      }

      .brand {
        margin-bottom: 32px;
        color: #a39a8e;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        line-height: 16px;
      }

      h1 {
        margin: 0 0 16px;
        color: #eceae6;
        font-family: "Space Grotesk", sans-serif;
        font-size: 36px;
        font-weight: 400;
        line-height: 1.2;
      }

      p {
        max-width: 28rem;
        margin: 0;
        color: #a39a8e;
        font-size: 16px;
        line-height: 28px;
      }

      .button {
        display: inline-block;
        margin-top: 32px;
        padding: 10px 16px;
        border: 1px solid #3a3937;
        border-radius: 4px;
        background: #232323;
        color: #eceae6;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        line-height: 20px;
        text-decoration: none;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          opacity 150ms ease;
      }

      .button:hover {
        background: #2a2a2a;
        border-color: #4a4845;
      }

      .button:active {
        opacity: 0.75;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="content">
        <div class="brand">
          MARS EXPLORER
        </div>

        <h1>
          Page not found.
        </h1>

        <p>
          The destination you're looking for doesn't exist.
          Please return to Mars and continue exploring.
        </p>

        <a class="button" href="/">
          Return to Mars
        </a>
      </div>
    </main>
  </body>
</html>
