<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page Not Found</title>

    <link rel="icon" href="/mars-globe.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        background: #131313;
        color: #eceae6;
        font-family: "Inter", sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content {
        width: 100%;
        max-width: 32rem;
      }

      .brand {
        margin-bottom: 2rem;
        color: #a39a8e;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        line-height: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        color: #eceae6;
        font-family: "Space Grotesk", sans-serif;
        font-size: 2.25rem;
        font-weight: 400;
        line-height: 1.1;
      }

      p {
        max-width: 28rem;
        margin: 0;
        color: #a39a8e;
        font-size: 0.875rem;
        line-height: 1.75rem;
      }

      .code {
        margin-top: 2rem;
        color: #6f6961;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
      }

      .home {
        display: inline-block;
        margin-top: 2rem;
        color: #eceae6;
        font-family: "Inter", sans-serif;
        font-size: 0.875rem;
        text-decoration: none;
        border-bottom: 1px solid #5b93c9;
        padding-bottom: 2px;
      }

      .home:hover {
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="content">
        <div class="brand">MARS EXPLORER</div>

        <h1>Page not found.</h1>

        <p>
          The destination you're looking for doesn't exist.
          Please return to Mars and continue exploring the mission archive.
        </p>

        <div class="code">ERROR 404 · TRAJECTORY NOT FOUND</div>

        <a class="home" href="/">Return to Mars</a>
      </div>
    </main>
  </body>
</html>
